<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>要事</title>
<meta name="theme-color" content="#f7f5ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   DESIGN TOKENS — Soft Modern + Warm Coral
   ═══════════════════════════════════════════════════ */
:root {
  /* Surfaces */
  --bg: #f7f5ef;
  --bg-soft: #f1ede2;
  --bg-deep: #e8e2d2;
  --card: #ffffff;
  --card-tinted: #fdfbf5;

  /* Inks */
  --ink: #1a1817;
  --ink-2: #5a5650;
  --ink-3: #968f83;
  --ink-4: #c8c2b3;
  --line: #ece6d6;
  --line-soft: #f3eee0;

  /* Accent — warm coral */
  --accent: #f25c39;
  --accent-soft: #ff8265;
  --accent-light: #ffb29c;
  --accent-bg: #fff0eb;
  --accent-bg-deep: #ffe1d4;
  --accent-deep: #c54422;

  /* Functional */
  --done: #6ba577;
  --done-bg: #e8f3ec;
  --warning: #e8a134;
  --info: #5b8def;
  --danger: #d44a3c;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(40,28,12,0.03);
  --shadow-sm: 0 2px 6px rgba(40,28,12,0.04), 0 1px 2px rgba(40,28,12,0.03);
  --shadow-md: 0 6px 20px rgba(40,28,12,0.06), 0 2px 6px rgba(40,28,12,0.04);
  --shadow-lg: 0 16px 40px rgba(40,28,12,0.1), 0 6px 12px rgba(40,28,12,0.05);
  --shadow-coral: 0 10px 28px -6px rgba(242,92,57,0.3), 0 4px 10px rgba(242,92,57,0.15);

  /* Geometry */
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 26px;

  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);

  --font: 'Manrope', 'Noto Sans TC', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow-x:hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
  letter-spacing: -0.01em;
  padding-bottom: calc(96px + var(--safe-bottom));
  position: relative;
}

/* Soft warm glow background */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 80% 0%, rgba(242,92,57,0.05), transparent 60%),
    radial-gradient(ellipse 60% 40% at 20% 100%, rgba(232,162,52,0.04), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.app { position: relative; z-index: 1; max-width: 580px; margin: 0 auto; padding: 0 18px; }

/* ═══════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════ */
.app-header {
  padding: calc(20px + var(--safe-top)) 0 22px;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.greet {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-2);
}
.greet .icon {
  font-size: 16px;
  display: inline-flex;
}
.settings-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--card);
  border: none;
  color: var(--ink-2);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s ease, box-shadow 0.15s;
}
.settings-btn:active {
  transform: scale(0.94);
  box-shadow: var(--shadow-xs);
}

.date-row {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 4px;
}
.date-day {
  font-family: var(--font);
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -1.5px;
  line-height: 1;
  color: var(--ink);
  background: linear-gradient(135deg, var(--ink), var(--ink) 50%, var(--accent-deep));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.date-month {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-2);
  letter-spacing: -0.3px;
}
.date-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--ink-3);
  font-weight: 500;
}
.date-meta .dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--ink-4);
}
.date-meta .week {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* ═══════════════════════════════════════════════════
   PAGE
   ═══════════════════════════════════════════════════ */
.page { display: none; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ═══════════════════════════════════════════════════
   MIT CARD — Soft Modern
   ═══════════════════════════════════════════════════ */
.mit-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 18px 18px 14px;
  box-shadow: var(--shadow-md);
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
.mit-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent-soft) 50%, transparent 100%);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  opacity: 0.85;
}
.mit-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.mit-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--ink);
}
.mit-prog {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  background: var(--bg-soft);
  padding: 4px 10px;
  border-radius: 100px;
}
.mit-prog.complete {
  background: var(--done-bg);
  color: var(--done);
}
.mit-prog .t { color: var(--ink-3); }

.mit-list {
  display: flex;
  flex-direction: column;
}

.mit-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 4px;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.18s ease, opacity 0.15s, box-shadow 0.15s, background 0.15s;
  border-radius: 10px;
}
.mit-row + .mit-row::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 38px;
  right: 12px;
  height: 1px;
  background: var(--line-soft);
}
.mit-row.dragging {
  background: var(--card-tinted);
  box-shadow: var(--shadow-lg);
  z-index: 10;
  transition: none;
}
.mit-row.dragging::before { display: none; }
.mit-row.done { opacity: 0.5; }

.mit-handle {
  width: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  color: var(--ink-4);
  touch-action: none;
  flex-shrink: 0;
  height: 20px;
}
.mit-handle:active { cursor: grabbing; color: var(--accent); }
.mit-handle .dots {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2.5px;
}
.mit-handle .dots span {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: currentColor;
}

.mit-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  width: 22px;
  text-align: center;
  flex-shrink: 0;
  letter-spacing: -0.5px;
  line-height: 1;
}
.mit-row.done .mit-num { color: var(--ink-4); }

.mit-check {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--ink-4);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  color: transparent;
  transition: 0.2s;
}
.mit-check:active { transform: scale(0.88); }
.mit-row.done .mit-check {
  background: var(--done);
  border-color: var(--done);
  color: #fff;
}

.mit-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.mit-title-text {
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.35;
  word-break: break-word;
  outline: none;
  letter-spacing: -0.2px;
}
.mit-row.done .mit-title-text {
  text-decoration: line-through;
  color: var(--ink-3);
}
.mit-title-text[contenteditable="true"] {
  outline: none;
  background: var(--accent-bg);
  padding: 1px 4px;
  margin: -1px -4px;
  border-radius: 4px;
}

.mit-time-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-bg);
  padding: 3px 8px;
  border-radius: 6px;
  align-self: flex-start;
  cursor: pointer;
  letter-spacing: 0.3px;
  transition: 0.15s;
}
.mit-time-chip:active { background: var(--accent-bg-deep); }
.mit-time-chip .icon { font-size: 10px; opacity: 0.7; }

.mit-time-empty {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  color: var(--ink-3);
  font-weight: 500;
  cursor: pointer;
  align-self: flex-start;
  padding: 2px 4px;
  margin: 0 -4px;
  border-radius: 4px;
  transition: 0.15s;
}
.mit-time-empty:active { background: var(--bg-soft); color: var(--accent); }
.mit-time-empty .plus {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--ink-4);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 700;
}

.mit-delete {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: var(--ink-4);
  cursor: pointer;
  font-size: 12px;
  flex-shrink: 0;
  opacity: 0.6;
  transition: 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.mit-delete:active {
  background: rgba(212,74,60,0.08);
  color: var(--danger);
  opacity: 1;
}

.mit-empty {
  text-align: center;
  padding: 32px 16px 18px;
  color: var(--ink-3);
}
.mit-empty .big {
  font-size: 36px;
  margin-bottom: 6px;
  filter: grayscale(40%);
  opacity: 0.6;
}
.mit-empty .text {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 2px;
}
.mit-empty .small {
  font-size: 12px;
  color: var(--ink-3);
}

.mit-add-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 4px 8px;
  margin-top: 2px;
  border-top: 1px solid var(--line-soft);
}
.mit-add-row.hidden { display: none; }
.mit-add-icon {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent-bg);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}
.mit-add-input {
  flex: 1;
  padding: 8px 0;
  background: transparent;
  border: none;
  font-family: var(--font);
  font-size: 14.5px;
  color: var(--ink);
  outline: none;
}
.mit-add-input::placeholder {
  color: var(--ink-3);
  font-weight: 400;
}
.mit-add-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 7px 14px;
  border-radius: 18px;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.5px;
  box-shadow: var(--shadow-coral);
  flex-shrink: 0;
}
.mit-add-btn:active { transform: scale(0.94); }
.mit-add-btn.hidden { display: none; }

/* ═══════════════════════════════════════════════════
   SECTION HEADER
   ═══════════════════════════════════════════════════ */
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding: 0 4px;
}
.sec-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sec-title .count {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-3);
  background: var(--card);
  padding: 3px 9px;
  border-radius: 100px;
  box-shadow: var(--shadow-xs);
}
.sec-link {
  background: none;
  border: none;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.sec-link:active { background: var(--accent-bg); }

/* ═══════════════════════════════════════════════════
   TIMELINE — Soft Modern (subtle line, floating cards)
   ═══════════════════════════════════════════════════ */
.timeline {
  position: relative;
  padding-left: 64px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 56px;
  top: 12px;
  bottom: 12px;
  width: 2px;
  background: linear-gradient(to bottom, transparent, var(--line) 8%, var(--line) 92%, transparent);
  border-radius: 1px;
}

.tl-item {
  position: relative;
  margin-bottom: 12px;
  padding: 0;
}
.tl-item:last-child { margin-bottom: 0; }

.tl-time {
  position: absolute;
  left: -64px;
  top: 14px;
  width: 50px;
  text-align: right;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  letter-spacing: 0.3px;
  line-height: 1.3;
}
.tl-time .end {
  display: block;
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-4);
  margin-top: 1px;
}
.tl-time.allday {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
}

.tl-dot {
  position: absolute;
  left: -14px;
  top: 18px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--card);
  border: 2.5px solid var(--ink-4);
  box-sizing: border-box;
  z-index: 2;
}

.tl-content {
  background: var(--card);
  border-radius: var(--r-md);
  padding: 12px 14px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 3px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.tl-content:active {
  transform: scale(0.99);
  box-shadow: var(--shadow-xs);
}
.tl-title {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.2px;
  line-height: 1.35;
}
.tl-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: var(--ink-3);
  font-weight: 500;
  flex-wrap: wrap;
}
.tl-meta .loc {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* MIT in timeline — coral accent */
.tl-item.is-mit .tl-dot {
  background: var(--accent);
  border-color: var(--accent);
}
.tl-item.is-mit .tl-dot::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.2;
  z-index: -1;
}
.tl-item.is-mit .tl-time { color: var(--accent); }
.tl-item.is-mit .tl-content {
  background: linear-gradient(135deg, #fff 60%, var(--accent-bg) 200%);
  border-left: 3px solid var(--accent);
  padding-left: 11px;
}
.tl-mit-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.8px;
  color: var(--accent);
  background: var(--accent-bg);
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
}

/* Active event */
.tl-item.is-now .tl-dot {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(242,92,57,0.18);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(242,92,57,0.18); }
  50% { box-shadow: 0 0 0 7px rgba(242,92,57,0.08); }
}
.tl-item.is-now .tl-content {
  box-shadow: var(--shadow-coral);
}
.tl-now-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  background: var(--accent);
  color: #fff;
  padding: 2px 6px;
  border-radius: 3px;
  text-transform: uppercase;
}

/* Past */
.tl-item.is-past { opacity: 0.5; }

.tl-empty {
  text-align: center;
  padding: 36px 16px;
  background: var(--card);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-xs);
  color: var(--ink-3);
}
.tl-empty .icon {
  font-size: 32px;
  margin-bottom: 6px;
  opacity: 0.5;
}
.tl-empty .text {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 2px;
}
.tl-empty .small {
  font-size: 11.5px;
  color: var(--ink-3);
  font-weight: 500;
}

/* ═══════════════════════════════════════════════════
   CALENDAR
   ═══════════════════════════════════════════════════ */
.cal-wrap {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 16px 12px 14px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-md);
}
.cal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 6px;
  margin-bottom: 14px;
}
.cal-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.cal-title .year {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
  letter-spacing: 0.5px;
}
.cal-nav { display: flex; align-items: center; gap: 4px; }
.cal-nav button {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: var(--bg-soft);
  border: none;
  color: var(--ink-2);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}
.cal-nav button:active { background: var(--bg-deep); transform: scale(0.94); }
.cal-today-btn {
  width: auto !important;
  padding: 0 12px !important;
  font-size: 12px !important;
  font-weight: 700 !important;
  background: var(--accent-bg) !important;
  color: var(--accent) !important;
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  margin-bottom: 4px;
}
.cal-weekdays span {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 600;
  color: var(--ink-3);
  padding: 4px 0;
  letter-spacing: 0.5px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-day {
  min-height: 52px;
  min-width: 0;         /* KEY: prevents grid overflow */
  overflow: hidden;     /* KEY: clips children to cell */
  display: flex;
  flex-direction: column;
  align-items: stretch; /* stretch so children fill width */
  padding: 4px 2px 3px;
  background: transparent;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  color: var(--ink);
  position: relative;
  font-family: var(--font);
  transition: 0.12s;
}
.cal-day:active { background: var(--bg-soft); }
.cal-day.other { color: var(--ink-4); opacity: 0.5; pointer-events: none; }
.cal-day.today .cal-num {
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
}
.cal-day.selected .cal-num {
  background: var(--ink);
  color: #fff;
  border-radius: 50%;
}
.cal-day.selected.today .cal-num { background: var(--accent); }
.cal-num {
  width: 24px; height: 24px;
  font-size: 13px;
  font-weight: 600;
  line-height: 24px;
  text-align: center;
  flex-shrink: 0;
  align-self: center; /* keep number centered horizontally */
  letter-spacing: -0.2px;
  border-radius: 50%;
}

/* Event snippets inside calendar cells */
.cal-evs {
  width: 100%;
  max-width: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-top: 2px;
}
.cal-ev {
  display: block;
  width: 100%;
  max-width: 100%;
  font-size: 8.5px;
  font-weight: 600;
  color: var(--accent-deep);
  background: var(--accent-bg);
  border-radius: 3px;
  padding: 1px 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.6;
  letter-spacing: -0.1px;
  box-sizing: border-box;
}
.cal-ev.allday {
  background: var(--bg-soft);
  color: var(--ink-3);
}
.cal-more {
  width: 100%;
  font-size: 8px;
  font-weight: 700;
  color: var(--ink-3);
  text-align: center;
  letter-spacing: 0.3px;
  line-height: 1.6;
}

/* Day detail */
.day-title-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
  padding: 0 4px;
}
.day-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--ink);
}
.day-title .day-emphasis {
  color: var(--accent);
}
.day-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 0.3px;
}

/* ═══════════════════════════════════════════════════
   BOTTOM NAV — Floating pill
   ═══════════════════════════════════════════════════ */
.bottom-nav {
  position: fixed;
  bottom: calc(16px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: var(--card);
  padding: 6px;
  border-radius: 30px;
  box-shadow: var(--shadow-lg);
  z-index: 30;
}
.nav-btn {
  background: transparent;
  border: none;
  padding: 9px 24px;
  border-radius: 22px;
  color: var(--ink-3);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.22s cubic-bezier(.4,0,.2,1);
  letter-spacing: -0.2px;
}
.nav-btn.active {
  background: var(--ink);
  color: #fff;
}

/* ═══════════════════════════════════════════════════
   FAB
   ═══════════════════════════════════════════════════ */
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(82px + var(--safe-bottom));
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--accent);
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  color: #fff;
  border: none;
  font-size: 28px;
  font-weight: 300;
  cursor: pointer;
  box-shadow: var(--shadow-coral);
  z-index: 25;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s ease;
}
.fab:active { transform: scale(0.9); }

/* ═══════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,24,23,0.45);
  backdrop-filter: blur(8px);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 580px;
  max-height: 92vh;
  overflow-y: auto;
  animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  padding-bottom: var(--safe-bottom);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-handle {
  width: 40px; height: 4px;
  background: var(--ink-4);
  border-radius: 2px;
  margin: 10px auto 6px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 22px 10px;
}
.modal-title {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.modal-close {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--bg-soft);
  border: none;
  color: var(--ink-2);
  cursor: pointer;
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:active { background: var(--bg-deep); }
.modal-body { padding: 4px 22px 14px; }
.modal-footer {
  display: flex;
  gap: 8px;
  padding: 12px 22px calc(20px + var(--safe-bottom));
  background: var(--bg);
  position: sticky;
  bottom: 0;
  border-top: 1px solid var(--line-soft);
}

/* Form */
.field { margin-bottom: 14px; }
.field-label {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 6px;
  letter-spacing: -0.1px;
}
.field input, .field textarea, .field select {
  width: 100%;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  font-family: var(--font);
  font-size: 15px;
  color: var(--ink);
  outline: none;
  transition: 0.15s;
  box-shadow: var(--shadow-xs);
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--accent-light);
  box-shadow: 0 0 0 4px rgba(242,92,57,0.08);
}
.field textarea { resize: vertical; min-height: 68px; line-height: 1.5; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Duration chips — quick time-range picker */
.duration-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: -4px;
  margin-bottom: 14px;
  align-items: center;
}
.duration-label {
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 600;
  letter-spacing: -0.1px;
  margin-right: 2px;
}
.dur-chip {
  padding: 6px 12px;
  background: var(--card);
  border: none;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  box-shadow: var(--shadow-xs);
  transition: 0.15s;
  letter-spacing: -0.1px;
  white-space: nowrap;
}
.dur-chip:active { transform: scale(0.94); }
.dur-chip.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(242,92,57,0.3);
}

/* Favorites — quick-apply templates in schedule modal */
.fav-section {
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line-soft);
}
.fav-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  padding: 0 2px;
}
.fav-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-2);
  letter-spacing: -0.1px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.fav-label .pin {
  color: var(--accent);
  font-size: 12px;
}
.fav-edit-btn {
  background: none;
  border: none;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  padding: 3px 8px;
  border-radius: 6px;
  font-family: var(--font);
}
.fav-edit-btn:active { background: var(--accent-bg); }
.fav-edit-btn.editing { color: var(--ink-2); }

.fav-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 2px;
  scrollbar-width: none;
}
.fav-scroll::-webkit-scrollbar { display: none; }

.fav-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  background: var(--card);
  border: none;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  box-shadow: var(--shadow-xs);
  transition: 0.15s;
  letter-spacing: -0.2px;
}
.fav-chip:active { transform: scale(0.96); }
.fav-chip .fav-time {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
}
.fav-chip .fav-del {
  display: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  align-items: center;
  justify-content: center;
  margin-left: -2px;
  margin-right: -6px;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  font-weight: 700;
}
.fav-section.editing .fav-chip { animation: shake 0.4s infinite; }
.fav-section.editing .fav-chip .fav-del { display: flex; }
@keyframes shake {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-0.6deg); }
  75% { transform: rotate(0.6deg); }
}

.fav-empty {
  font-size: 12px;
  color: var(--ink-3);
  font-style: italic;
  padding: 8px 12px;
  font-weight: 500;
}

/* Save-as-favorite row */
.sav-fav-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--accent-bg);
  border-radius: var(--r-sm);
  font-size: 13.5px;
  color: var(--accent-deep);
  cursor: pointer;
  margin-top: 8px;
  font-weight: 600;
}
.sav-fav-row input[type="checkbox"] {
  accent-color: var(--accent);
  width: 17px;
  height: 17px;
}

.btn {
  flex: 1;
  padding: 13px 18px;
  border: none;
  border-radius: var(--r-sm);
  font-family: var(--font);
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.15s;
  letter-spacing: -0.1px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--ink);
  color: #fff;
}
.btn-primary .count {
  background: var(--accent);
  padding: 2px 8px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
}
.btn-secondary {
  background: var(--card);
  color: var(--ink-2);
  box-shadow: var(--shadow-xs);
}
.btn-danger {
  background: transparent;
  color: var(--danger);
}

/* Multi-day */
.md-section {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line-soft);
}
.md-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 14px;
  background: var(--accent-bg);
  border: none;
  border-radius: var(--r-sm);
  color: var(--accent-deep);
  font-family: var(--font);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.1px;
  transition: 0.15s;
}
.md-toggle.expanded {
  background: var(--accent);
  color: #fff;
}
.md-toggle .icon { font-size: 15px; }
.md-toggle .arrow { margin-left: auto; transition: transform 0.2s; opacity: 0.7; }
.md-toggle.expanded .arrow { transform: rotate(180deg); }
.md-toggle .count-text {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  background: rgba(255,255,255,0.25);
  padding: 2px 8px;
  border-radius: 100px;
  letter-spacing: 0.3px;
}
.md-toggle:not(.expanded) .count-text {
  background: rgba(242,92,57,0.15);
}

.md-content {
  display: none;
  margin-top: 12px;
}
.md-content.shown { display: block; }

.md-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
  min-height: 28px;
}
.md-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px 5px 11px;
  background: var(--accent);
  color: #fff;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.1px;
  box-shadow: 0 2px 6px rgba(242,92,57,0.25);
}
.md-chip .x {
  cursor: pointer;
  opacity: 0.75;
  font-size: 13px;
  line-height: 1;
  width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.md-chip .star {
  font-size: 10px;
  opacity: 0.85;
}
.md-chip.empty {
  background: var(--card);
  color: var(--ink-3);
  font-weight: 500;
  box-shadow: var(--shadow-xs);
}

.md-mini-cal {
  background: var(--card);
  border-radius: var(--r-md);
  padding: 12px 10px;
  box-shadow: var(--shadow-xs);
}
.md-cal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 4px 10px;
}
.md-cal-month {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.md-cal-month em { color: var(--accent); font-style: normal; }
.md-cal-nav { display: flex; gap: 4px; }
.md-cal-nav button {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--bg-soft);
  border: none;
  color: var(--ink-2);
  font-size: 12px;
  cursor: pointer;
}
.md-cal-nav button:active { background: var(--bg-deep); }
.md-cal-wd {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
}
.md-cal-wd span {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 0.3px;
  padding: 3px 0;
}
.md-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.md-cal-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 2px solid transparent;
  border-radius: 50%;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  transition: 0.12s;
}
.md-cal-day:active { transform: scale(0.9); }
.md-cal-day.other { color: var(--ink-4); pointer-events: none; opacity: 0.4; }
.md-cal-day.today {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 700;
}
.md-cal-day.picked {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 700;
}
.md-cal-day.picked.today { border-color: var(--ink); }

.md-cal-quick {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.md-cal-quick button {
  padding: 6px 12px;
  background: var(--card);
  border: none;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 11.5px;
  color: var(--ink-2);
  cursor: pointer;
  font-weight: 600;
  box-shadow: var(--shadow-xs);
  letter-spacing: -0.1px;
}
.md-cal-quick button:active { background: var(--bg-soft); }

/* Sync toggle */
.sync-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--card);
  border-radius: var(--r-sm);
  font-size: 13.5px;
  color: var(--ink-2);
  cursor: pointer;
  margin-top: 14px;
  box-shadow: var(--shadow-xs);
  font-weight: 500;
}
.sync-row input[type="checkbox"] {
  accent-color: var(--accent);
  width: 17px;
  height: 17px;
}

/* ═══════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════ */
.toast-box {
  position: fixed;
  top: calc(14px + var(--safe-top));
  left: 18px; right: 18px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 12px 16px;
  background: var(--ink);
  color: #fff;
  border-radius: var(--r-sm);
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: -0.1px;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.3s cubic-bezier(.16,1,.3,1), toastOut 0.3s ease 2.6s forwards;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.success { background: var(--done); }
.toast.error { background: var(--danger); }
.toast::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-12px); } }

/* ═══════════════════════════════════════════════════
   SETTINGS
   ═══════════════════════════════════════════════════ */
.set-card {
  background: var(--card);
  border-radius: var(--r-md);
  padding: 16px 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.set-card h4 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: -0.2px;
}
.set-card .desc {
  font-size: 12px;
  color: var(--ink-3);
  margin-bottom: 14px;
  line-height: 1.55;
}
.set-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 5px 11px;
  border-radius: 100px;
}
.set-status.on { background: var(--done-bg); color: var(--done); }
.set-status.off { background: var(--bg-soft); color: var(--ink-3); }

.spinner {
  display: inline-block;
  width: 11px; height: 11px;
  border: 2px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* MIT Time modal */
.mt-display {
  text-align: center;
  padding: 4px 0 18px;
}
.mt-display .label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: -0.1px;
  margin-bottom: 4px;
}
.mt-display .name {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.2px;
}

/* ─── Daily Non-Negotiables ─── */
.daily-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 18px 18px 14px;
  box-shadow: var(--shadow-md);
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
.daily-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--done) 0%, #8ecb9a 60%, transparent 100%);
  opacity: 0.85;
}
.daily-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.daily-title-text {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--ink);
}
.daily-prog {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  background: var(--bg-soft);
  padding: 4px 10px;
  border-radius: 100px;
}
.daily-prog.complete {
  background: var(--done-bg);
  color: var(--done);
}
.daily-list { display: flex; flex-direction: column; }
.daily-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  position: relative;
  transition: opacity 0.15s;
}
.daily-item + .daily-item::before {
  content: '';
  position: absolute;
  top: 0; left: 38px; right: 12px;
  height: 1px;
  background: var(--line-soft);
}
.daily-item.done { opacity: 0.5; }
.daily-check {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--ink-4);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;

<body>

<div class="app">

  <header class="app-header">
    <div class="header-top">

  <main>

      </div>

      <section class="mit-card">
        <header class="mit-header">
          <div class="mit-title">今日要事</div>

        <div class="mit-list" id="mitList"></div>
        <div class="mit-add-row" id="mitAdd">

                 onkeydown="if(event.key==='Enter'){event.preventDefault();addMit();}">
          <button class="mit-add-btn" onclick="addMit()">加入</button>
        </div>
      </section>

      <!-- Daily non-negotiables -->

      </section>

      <section>
        <div class="sec-head">

          </div>

        </div>
        <div id="todayTimeline"></div>

      <!-- Tomorrow preview -->

        <div class="day-title" id="dayTitle"></div>
        <div class="day-meta" id="dayMeta"></div>

</div>

    </div>
    <div class="modal-footer">

<script>

// ════════════════════════════════════════════════
const DOW_ZH = ['日','一','二','三','四','五','六'];
const MONTH_ZH = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];

function fmtDate(d) {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function todayStr() { return fmtDate(new Date()); }
function parseDate(ds) { return new Date(ds + 'T00:00:00'); }
function weekNum(d) {
  const onejan = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
}

function renderHeader() {
  const now = new Date();
  const h = now.getHours();
  let g, icon;
  if(h < 5) { g = '凌晨好'; icon = '🌙'; }
  else if(h < 12) { g = '早安'; icon = '☀️'; }

  else { g = '晚安'; icon = '🌙'; }

}

let mitData = loadMit();

function renderMit() {
  mitData = loadMit();
  const list = document.getElementById('mitList');
  const items = mitData.items;
  const done = items.filter(i => i.done).length;
  const total = items.length;

  const progEl = document.getElementById('mitProgress');
  progEl.innerHTML = `${done}<span class="t">/${total || 3}</span>`;
  progEl.classList.toggle('complete', total > 0 && done === total);

  document.getElementById('mitAdd').classList.toggle('hidden', items.length >= 3);

  if(!items.length) {
    list.innerHTML = `<div class="mit-empty">
      <div class="big">✦</div>
      <div class="text">今天最想做的三件事</div>
      <div class="small">在下方加入第一件</div>
    </div>`;
    return;
  }

  list.innerHTML = items.map((item, idx) => {
    const timeHTML = item.startTime
      ? `<span class="mit-time-chip" onclick="event.stopPropagation();openMitTime('${item.id}')"><span class="icon">⏱</span>${item.startTime}${item.endTime?' – '+item.endTime:''}</span>`
      : `<span class="mit-time-empty" onclick="event.stopPropagation();openMitTime('${item.id}')"><span class="plus">+</span>設定時間</span>`;
    return `<div class="mit-row${item.done ? ' done' : ''}" data-mit-id="${item.id}" data-idx="${idx}">
      <div class="mit-handle"><div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
      <div class="mit-num">${idx+1}</div>
      <button class="mit-check" onclick="toggleMit('${item.id}')" aria-label="完成"></button>
      <div class="mit-body">
        <div class="mit-title-text" data-edit-id="${item.id}" onclick="editMitTitle(this,'${item.id}')">${esc(item.title)}</div>
        ${timeHTML}
      </div>
      <button class="mit-delete" onclick="deleteMit('${item.id}')" aria-label="刪除">✕</button>
    </div>`;
  }).join('');

  setupSortable(list);
}

function addMit() {
  const inp = document.getElementById('mitInput');
  const text = inp.value.trim();
  if(!text) { inp.focus(); return; }
  if(mitData.items.length >= 3) { toast('最多 3 件要事', 'error'); return; }
  mitData.items.push({ id: uid(), title: text, done: false });
  saveMit(mitData);
  inp.value = '';
  renderMit();
  renderTodayTimeline();
}

function toggleMit(id) {
  const item = mitData.items.find(x => x.id === id);
  if(!item) return;
  item.done = !item.done;
  item.completedAt = item.done ? new Date().toISOString() : null;
  saveMit(mitData);
  renderMit();
  renderTodayTimeline();
}

function deleteMit(id) {
  mitData.items = mitData.items.filter(x => x.id !== id);
  saveMit(mitData);
  renderMit();
  renderTodayTimeline();
}

function editMitTitle(el, id) {
  if(el.dataset.editing === '1') return;
  el.dataset.editing = '1';
  el.contentEditable = 'true';
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const finish = () => {
    el.contentEditable = 'false';
    el.dataset.editing = '0';
    const newTitle = el.textContent.trim();
    const item = mitData.items.find(x => x.id === id);
    if(item) {
      if(!newTitle) { deleteMit(id); return; }
      if(newTitle !== item.title) {
        item.title = newTitle;
        saveMit(mitData);
        renderTodayTimeline();
      }
    }
    el.removeEventListener('blur', finish);
    el.removeEventListener('keydown', onKey);
  };
  const onKey = e => {
    if(e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if(e.key === 'Escape') {
      e.preventDefault();
      el.textContent = mitData.items.find(x => x.id === id)?.title || '';
      el.blur();
    }
  };
  el.addEventListener('blur', finish);
  el.addEventListener('keydown', onKey);
}

// Sync to GAS
async function syncDailyToGas() {
  const s = loadSetts();
  if(!s.whBackend) { toast('請先設定 Backend URL', 'error'); return; }
  const btn = document.getElementById('syncGasBtn');
  btn.innerHTML = '<span class="spinner"></span> 同步中...';
  btn.disabled = true;

  const tasks = loadDailyTpl();
  const timeVal = document.getElementById('pushTimeInput').value || '07:30';
  const [hour, minute] = timeVal.split(':').map(Number);

  try {
    // 1. Send daily tasks to GAS
    const r1 = await fetch(s.whBackend, {
      method: 'POST', headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'setDailyTasks', tasks })
    });

    // 2. Set morning trigger time
    const r2 = await fetch(s.whBackend, {
      method: 'POST', headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({ action: 'setTriggerTime', hour, minute })
    });

    if(r1.ok && r2.ok) {
      toast(`已同步！每天 ${timeVal} 推送 LINE ✅`, 'success');
    } else {
      toast('GAS 回應異常，請確認程式碼已更新', 'error');
    }
  } catch(e) {
    toast('同步失敗：' + e.message, 'error');
  } finally {
    btn.innerHTML = '<span>📤 同步到 LINE 推送</span>';
    btn.disabled = false;
  }
}

// Duration chips — quick set end-time
function setSchedDuration(minutes) {
  const startInput = document.getElementById('smStart');
  const endInput = document.getElementById('smEnd');
  let start = startInput.value;
  if(!start) {
    const now = new Date();
    const m = Math.floor(now.getMinutes() / 15) * 15;
    start = String(now.getHours()).padStart(2,'0') + ':' + String(m).padStart(2,'0');
    startInput.value = start;
  }
  const [h, m] = start.split(':').map(Number);
  const total = h * 60 + m + minutes;
  const endH = Math.floor(total / 60) % 24;
  const endM = total % 60;
  endInput.value = String(endH).padStart(2,'0') + ':' + String(endM).padStart(2,'0');
  updateSchedDurationChips();
}

function updateSchedDurationChips() {
  const start = document.getElementById('smStart').value;
  const end = document.getElementById('smEnd').value;
  const chips = document.querySelectorAll('#scheduleModal .dur-chip');
  if(!start || !end) {
    chips.forEach(c => c.classList.remove('active'));
    return;
  }
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if(diff < 0) diff += 24 * 60;
  chips.forEach(c => {
    const d = parseInt(c.dataset.duration);
    c.classList.toggle('active', d === diff);
  });
  checkConflicts(); // update conflict warning whenever times change
}

// Drag-sort
function setupSortable(listEl) {
  let active = null;

  const onDown = e => {
    const handle = e.target.closest('.mit-handle');
    if(!handle) return;
    const row = handle.closest('.mit-row');
    if(!row) return;
    e.preventDefault();
    try { handle.setPointerCapture(e.pointerId); } catch {}

    const rows = [...listEl.querySelectorAll('.mit-row')];
    const startIdx = rows.indexOf(row);
    const rect = row.getBoundingClientRect();
    const slotH = rect.height;

    active = {
      pointerId: e.pointerId,
      row, rows, startIdx,
      currentIdx: startIdx,
      startY: e.clientY,
      slotH,
    };
    row.classList.add('dragging');
  };

  const onMove = e => {
    if(!active || e.pointerId !== active.pointerId) return;
    const dy = e.clientY - active.startY;
    active.row.style.transform = `translateY(${dy}px)`;
    const offset = Math.round(dy / active.slotH);
    let newIdx = active.startIdx + offset;
    newIdx = Math.max(0, Math.min(active.rows.length - 1, newIdx));
    if(newIdx !== active.currentIdx) {
      active.rows.forEach((r, i) => {
        if(r === active.row) return;
        let shift = 0;
        if(active.startIdx < newIdx && i > active.startIdx && i <= newIdx) shift = -active.slotH;
        else if(active.startIdx > newIdx && i < active.startIdx && i >= newIdx) shift = active.slotH;
        r.style.transform = `translateY(${shift}px)`;
        r.style.transition = 'transform 0.18s ease';
      });
      active.currentIdx = newIdx;
      if(navigator.vibrate) navigator.vibrate(8);
    }
  };

  const onUp = e => {
    if(!active || e.pointerId !== active.pointerId) return;
    const { startIdx, currentIdx, rows, row } = active;
    rows.forEach(r => { r.style.transform = ''; r.style.transition = ''; });
    row.classList.remove('dragging');
    if(currentIdx !== startIdx) {
      const [moved] = mitData.items.splice(startIdx, 1);
      mitData.items.splice(currentIdx, 0, moved);
      saveMit(mitData);
      renderMit();
      renderTodayTimeline();
    }
    active = null;
  };

  listEl.addEventListener('pointerdown', onDown);
  listEl.addEventListener('pointermove', onMove);
  listEl.addEventListener('pointerup', onUp);
  listEl.addEventListener('pointercancel', onUp);
}

  const s = loadSetts();
  if(!s.whBackend) return;
  const key = `${year}-${String(month+1).padStart(2,'0')}`;
  if(gcalCache[key]) return;

  const timeMin = new Date(year, month, 1).toISOString();
  const timeMax = new Date(year, month+1, 0, 23, 59, 59).toISOString();

  gcalLoading = true;
  updateSyncIndicator();

  try {
    const r = await fetch(s.whBackend, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'calList', timeMin, timeMax })
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    let items;
    try { items = JSON.parse(text); } catch { items = []; }
    if(!Array.isArray(items)) items = items.events || items.items || [];
    gcalCache[key] = items.map(parseEvent);
  } catch(e) {
    console.error('GCal fetch:', e);
    toast('日曆同步失敗', 'error');
  }
  gcalLoading = false;
  updateSyncIndicator();
}

function parseEvent(ev) {
  const parseDT = raw => {
    if(!raw || typeof raw !== 'string') return { date: '', time: '', allDay: true };
    if(raw.length <= 10) return { date: raw, time: '', allDay: true };
    const d = new Date(raw);
    if(isNaN(d)) return { date: raw.slice(0,10), time: '', allDay: true };
    const pad = n => String(n).padStart(2, '0');
    return {
      date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
      time: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
      allDay: false
    };
  };
  const sRaw = ev.start?.dateTime || ev.startDateTime || ev.start || '';
  const eRaw = ev.end?.dateTime || ev.endDateTime || ev.end || '';
  const s = parseDT(sRaw);
  const en = parseDT(eRaw);
  return {
    id: ev.id || ev.eventId || uid(),
    title: ev.summary || ev.title || '(無標題)',
    date: s.date,
    startTime: s.time,
    endTime: en.time,
    location: ev.location || '',
    description: ev.description || '',
    allDay: s.allDay,
    htmlLink: ev.htmlLink || '',
  };
}

function getEventsForDate(ds) {
  const key = ds.slice(0, 7);
  return (gcalCache[key] || []).filter(e => e.date === ds);
}

function getMonthEvents(year, month) {
  const key = `${year}-${String(month+1).padStart(2,'0')}`;
  return gcalCache[key] || [];
}

function buildTimelineItems(dateStr) {
  const events = getEventsForDate(dateStr).map(ev => ({
    kind: 'event',
    title: ev.title,
    startTime: ev.startTime,
    endTime: ev.endTime,
    location: ev.location,
    allDay: ev.allDay,
    gcalId: ev.id,
  }));

  if(dateStr === todayStr()) {
    mitData.items.forEach((m, idx) => {
      if(m.startTime) {
        events.push({
          kind: 'mit',
          title: m.title,
          startTime: m.startTime,
          endTime: m.endTime,
          mitIdx: idx + 1,
          done: m.done,
          mitId: m.id,
        });
      }
    });
  }

  events.sort((a, b) => {
    if(a.allDay && !b.allDay) return -1;
    if(!a.allDay && b.allDay) return 1;
    return (a.startTime || '99').localeCompare(b.startTime || '99');
  });
  return events;
}

function renderTimelineItems(items, isToday) {
  if(!items.length) {
    return `<div class="tl-empty">
      <div class="icon">✧</div>
      <div class="text">這天沒有行程</div>
      <div class="small">點右下角 + 加入</div>
    </div>`;
  }

  const now = new Date();
  const nowHM = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  return '<div class="timeline">' + items.map(it => {
    if(it.kind === 'mit') {
      const timeBlock = `<div class="tl-time">${it.startTime}${it.endTime?`<span class="end">${it.endTime}</span>`:''}</div>`;
      return `<div class="tl-item is-mit">
        ${timeBlock}
        <div class="tl-dot"></div>
        <div class="tl-content">
          <div class="tl-title">${esc(it.title)}</div>
          <div class="tl-meta">
            <span class="tl-mit-badge">★ 要事 ${it.mitIdx}</span>
            ${it.done?'<span style="color:var(--done);">✓ 已完成</span>':''}
          </div>
        </div>
      </div>`;
    }
    const isPast = isToday && it.endTime && it.endTime < nowHM;
    const isNow = isToday && it.startTime && it.startTime <= nowHM && (!it.endTime || it.endTime > nowHM);
    const cls = isNow ? 'is-now' : isPast ? 'is-past' : '';
    const timeBlock = it.allDay || !it.startTime
      ? `<div class="tl-time allday">全天</div>`
      : `<div class="tl-time">${it.startTime}${it.endTime?`<span class="end">${it.endTime}</span>`:''}</div>`;
    return `<div class="tl-item ${cls}">
      ${timeBlock}
      <div class="tl-dot"></div>
      <div class="tl-content" onclick="openScheduleModal('${it.gcalId}')">
        <div class="tl-title">${esc(it.title)}</div>
        <div class="tl-meta">
          ${it.location?`<span class="loc">📍 ${esc(it.location)}</span>`:''}
          ${isNow?`<span class="tl-now-tag">NOW</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('') + '</div>';
}

let carryoverItems = [];

function checkCarryover() {
  const yesterday = fmtDate(new Date(Date.now() - 864e5));
  const td = todayStr();

  // Look for yesterday's MIT data
  let yestData = null;
  try {
    const raw = localStorage.getItem(SK.mit);
    if(raw) {
      const parsed = JSON.parse(raw);
      // It's yesterday if stored date is yesterday (we already rolled over in loadMit)
      // So we need to keep yesterday's data in a separate key before clearing
      if(parsed.date === yesterday) yestData = parsed;
    }
  } catch {}

  if(!yestData || !yestData.items) return;
  const incomplete = yestData.items.filter(i => !i.done);
  if(!incomplete.length) return;

  // Only show if today's MIT is empty
  const today = loadMit();
  if(today.items.length > 0) return;

  carryoverItems = incomplete;
  const el = document.getElementById('carryoverItems');
  el.innerHTML = incomplete.map(i =>
    `<div class="carryover-item">${esc(i.title)}${i.startTime ? `<span style="font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-left:auto;">${i.startTime}</span>` : ''}</div>`
  ).join('');
  document.getElementById('carryoverCard').classList.add('visible');
}

function confirmCarryover() {
  if(!carryoverItems.length) return;
  const td = todayStr();
  const newItems = carryoverItems.map(i => ({
    id: uid(),
    title: i.title,
    done: false,
    startTime: i.startTime || null,
    endTime: i.endTime || null,
  }));
  mitData = { date: td, items: newItems };
  saveMit(mitData);
  dismissCarryover();
  renderMit();
  renderTodayTimeline();
  toast(`已帶入 ${newItems.length} 件要事 ✦`, 'success');
}

function dismissCarryover() {
  document.getElementById('carryoverCard').classList.remove('visible');
  carryoverItems = [];
  // Mark as dismissed for today so it won't re-appear
  try { localStorage.setItem('yj_carryover_dismissed', todayStr()); } catch {}
}

// Preserve yesterday's MIT before it rolls over
function preserveYesterdayMit() {
  try {
    const raw = localStorage.getItem(SK.mit);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    const td = todayStr();
    // If stored date is yesterday, save a copy under the yesterday key before overwriting
    if(parsed.date && parsed.date !== td) {
      localStorage.setItem('yj_mit_yesterday', raw);
    }
  } catch {}
}

//  FEATURE 3: CONFLICT DETECTION
// ════════════════════════════════════════════════
function checkConflicts() {
  const date = document.getElementById('smDate').value;
  const start = document.getElementById('smStart').value;
  const end = document.getElementById('smEnd').value;
  const editId = document.getElementById('smGcalId').value;
  const warn = document.getElementById('conflictWarning');
  const list = document.getElementById('conflictList');

  // Need date + start to check
  if(!date || !start) {
    warn.classList.remove('visible');
    return;
  }

  const events = getEventsForDate(date).filter(ev =>
    ev.id !== editId && // skip self
    ev.startTime && ev.endTime && !ev.allDay
  );

  const newStart = start;
  const newEnd = end || (() => {
    const [h, m] = start.split(':').map(Number);
    return String((h+1) % 24).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  })();

  const conflicts = events.filter(ev => {
    // overlap if newStart < evEnd AND newEnd > evStart
    return newStart < ev.endTime && newEnd > ev.startTime;
  });

  if(!conflicts.length) {
    warn.classList.remove('visible');
    return;
  }

  warn.classList.add('visible');
  list.innerHTML = conflicts.map(ev =>
    `${ev.startTime}–${ev.endTime} 與「${esc(ev.title)}」重疊`
  ).join('<br>');
}

let calYear = new Date().getFullYear();

function calNav(delta) {
  calMonth += delta;
  if(calMonth > 11) { calMonth = 0; calYear++; }
  if(calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
  fetchMonth(calYear, calMonth).then(renderCalendar);
}
function calToday() {
  const now = new Date();
  calYear = now.getFullYear();

}

function renderCalendar() {
  document.getElementById('calTitle').innerHTML =
    `${MONTH_ZH[calMonth]}月 <span class="year">${calYear}</span>`;

  const first = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth+1, 0).getDate();
  const startDow = first.getDay();
  const td = todayStr();
  const sel = fmtDate(selectedDate);

  // Build event map for the month
  const monthEvents = getMonthEvents(calYear, calMonth);
  const dayMap = {};
  monthEvents.forEach(ev => {
    if(!dayMap[ev.date]) dayMap[ev.date] = [];
    dayMap[ev.date].push(ev);
  });
  // Sort each day's events by time
  Object.keys(dayMap).forEach(k => {
    dayMap[k].sort((a, b) => (a.startTime || '99').localeCompare(b.startTime || '99'));
  });

  const MAX_SHOW = 2;

  function evSnippets(ds) {
    const evts = dayMap[ds];
    if(!evts || !evts.length) return '';
    const show = evts.slice(0, MAX_SHOW);
    const more = evts.length - MAX_SHOW;
    const strips = show.map(ev => {
      const timePrefix = ev.startTime ? ev.startTime + ' ' : '';
      const cls = ev.allDay ? 'cal-ev allday' : 'cal-ev';
      return `<div class="${cls}">${timePrefix}${esc(ev.title)}</div>`;
    }).join('');
    const moreStr = more > 0 ? `<div class="cal-more">+${more}</div>` : '';
    return `<div class="cal-evs">${strips}${moreStr}</div>`;
  }

  let html = '';
  const prevLast = new Date(calYear, calMonth, 0).getDate();
  for(let i = startDow - 1; i >= 0; i--) {
    html += `<button class="cal-day other"><span class="cal-num">${prevLast - i}</span></button>`;
  }
  for(let d = 1; d <= lastDay; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = [];
    if(ds === td) cls.push('today');
    if(ds === sel) cls.push('selected');
    html += `<button class="cal-day ${cls.join(' ')}" onclick="selectDay('${ds}')">
      <span class="cal-num">${d}</span>
      ${evSnippets(ds)}
    </button>`;
  }
  const total = startDow + lastDay;
  const fill = total <= 35 ? 35 - total : 42 - total;
  for(let i = 1; i <= fill; i++) {
    html += `<button class="cal-day other"><span class="cal-num">${i}</span></button>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

function selectDay(ds) {
  selectedDate = parseDate(ds);

function renderDayTimeline() {

    html += `<div class="md-cal-day other">${prevLast - i}</div>`;
  }
  for(let d = 1; d <= lastDay; d++) {
    const ds = `${mdCalYear}-${String(mdCalMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = [];
    if(ds === td) cls.push('today');
    if(ds === mainDate || mdPickedDates.includes(ds)) cls.push('picked');
    html += `<div class="md-cal-day ${cls.join(' ')}" onclick="toggleMdDay('${ds}')">${d}</div>`;
  }
  const total = startDow + lastDay;
  const fill = total <= 35 ? 35 - total : 42 - total;
  for(let i = 1; i <= fill; i++) {
    html += `<div class="md-cal-day other">${i}</div>`;
  }
  document.getElementById('mdCalGrid').innerHTML = html;
}

function toggleMdDay(ds) {
  const mainDate = document.getElementById('smDate').value;
  if(ds === mainDate) return;
  const i = mdPickedDates.indexOf(ds);
  if(i >= 0) mdPickedDates.splice(i, 1);
  else mdPickedDates.push(ds);
  mdPickedDates.sort();
  renderMdChips();
  renderMdCal();
  updateSaveBtn();
}

function renderMdChips() {
  const el = document.getElementById('mdChips');
  const mainDate = document.getElementById('smDate').value;
  const allDates = [mainDate, ...mdPickedDates].filter(Boolean).sort();
  if(!allDates.length || (allDates.length === 1 && !mdPickedDates.length)) {
    el.innerHTML = `<div class="md-chip empty">尚未加選其他日期</div>`;
  } else {
    el.innerHTML = allDates.map(ds => {
      const d = parseDate(ds);
      const isMain = ds === mainDate;
      return `<div class="md-chip">${isMain?`<span class="star">★</span>`:''}${d.getMonth()+1}/${d.getDate()} ${DOW_ZH[d.getDay()]}${!isMain?`<span class="x" onclick="removeMdDay('${ds}')">✕</span>`:''}</div>`;
    }).join('');
  }
}

function removeMdDay(ds) {
  mdPickedDates = mdPickedDates.filter(x => x !== ds);
  renderMdChips();
  renderMdCal();
  updateSaveBtn();
}

function mdAddWeekly() {
  const mainDate = document.getElementById('smDate').value;
  if(!mainDate) return;
  const d = parseDate(mainDate);
  d.setDate(d.getDate() + 7);
  const ds = fmtDate(d);
  if(!mdPickedDates.includes(ds) && ds !== mainDate) {
    mdPickedDates.push(ds);
    mdPickedDates.sort();
    renderMdChips();
    renderMdCal();
    updateSaveBtn();
  }
}

function mdAddNextWeeks(n) {
  const mainDate = document.getElementById('smDate').value;
  if(!mainDate) return;
  const d = parseDate(mainDate);
  for(let i = 1; i <= n; i++) {
    const dd = new Date(d);
    dd.setDate(dd.getDate() + 7 * i);
    const ds = fmtDate(dd);
    if(!mdPickedDates.includes(ds) && ds !== mainDate) {
      mdPickedDates.push(ds);
    }
  }
  mdPickedDates.sort();
  renderMdChips();
  renderMdCal();
  updateSaveBtn();
}

function mdClear() {
  mdPickedDates = [];
  renderMdChips();
  renderMdCal();
  updateSaveBtn();
}

function updateSaveBtn() {
  const total = 1 + mdPickedDates.length;
  const btn = document.getElementById('smSaveBtn');
  const countText = document.getElementById('mdCountText');
  if(mdPickedDates.length) {
    btn.innerHTML = `建立 <span class="count">${total}</span>`;
    countText.textContent = `${total} 天`;
  } else {
    btn.textContent = '儲存';
    countText.textContent = '1 天';
  }
}

async function saveSchedule() {
  const title = document.getElementById('smTitleInput').value.trim();
  if(!title) { toast('請輸入標題', 'error'); return; }
  const date = document.getElementById('smDate').value;
  if(!date) { toast('請選擇日期', 'error'); return; }

  let startTime = document.getElementById('smStart').value;
  let endTime = document.getElementById('smEnd').value;
  if(startTime && !endTime) {
    const [h, m] = startTime.split(':').map(Number);
    endTime = String((h+1) % 24).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }

  const baseData = {
    title, startTime, endTime,
    location: document.getElementById('smLoc').value.trim(),
    note: document.getElementById('smNote').value.trim(),
  };
  const sync = document.getElementById('smSync').checked;
  const saveFav = document.getElementById('smSaveFav').checked;
  const gcalId = document.getElementById('smGcalId').value;
  const allDates = [date, ...mdPickedDates];

  // Save to favorites if requested (only when creating new)
  if(saveFav && !gcalId) {
    const favs = loadFavs();
    const exists = favs.some(f =>
      f.title === baseData.title && f.startTime === baseData.startTime
    );
    if(!exists) {
      favs.push({
        id: uid(),
        title: baseData.title,
        startTime: baseData.startTime,
        endTime: baseData.endTime,
        location: baseData.location,
        note: baseData.note,
        createdAt: new Date().toISOString(),
      });
      saveFavs(favs);
    }
  }

  closeModal('scheduleModal');

  if(sync) {
    if(gcalId) {
      await syncCalUpdate(gcalId, { ...baseData, date });
      toast('已更新', 'success');
    } else {
      let okCount = 0;
      for(const d of allDates) {
        const res = await syncCalCreate({ ...baseData, date: d });
        if(res) okCount++;
      }
      toast(`已建立 ${okCount} 筆行程`, 'success');
    }
    gcalCache = {};
    await fetchMonth(calYear, calMonth);
    for(const d of allDates) {
      const dd = parseDate(d);
      if(dd.getFullYear() !== calYear || dd.getMonth() !== calMonth) {
        await fetchMonth(dd.getFullYear(), dd.getMonth());
      }
    }
  } else {
    toast('已儲存', 'success');
  }
  renderToday();
  renderSchedulePage();
}

async function deleteSchedule() {
  const gcalId = document.getElementById('smGcalId').value;
  if(!gcalId) return;
  if(!confirm('刪除此行程?')) return;
  closeModal('scheduleModal');
  await syncCalDelete(gcalId);
  toast('已刪除', 'success');
  gcalCache = {};
  await fetchMonth(calYear, calMonth);
  renderToday();
  renderSchedulePage();
}

// ════════════════════════════════════════════════
//  SETTINGS
// ════════════════════════════════════════════════
function loadSettings() {
  const s = loadSetts();
  document.getElementById('setBackend').value = s.whBackend || '';
  updateSyncIndicator();
}
function saveSettings() {
  const url = document.getElementById('setBackend').value.trim();
  const s = loadSetts();
  s.whBackend = url;
  saveSetts(s);
  closeModal('settingsModal');
  toast('設定已儲存', 'success');
  gcalCache = {};
  fetchMonth(calYear, calMonth).then(() => {
    renderToday();
    renderSchedulePage();
  });
}
function exportData() {
  const data = { mit: loadMit(), settings: loadSetts(), exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `yaoji-${todayStr()}.json`;
  a.click();
  toast('已匯出', 'success');
}
function clearAll() {
  if(!confirm('清除所有本機資料?')) return;
  try {
    localStorage.removeItem(SK.mit);
    localStorage.removeItem(SK.settings);
  } catch {}
  mitData = loadMit();
  closeModal('settingsModal');
  toast('已清除', 'success');
  renderToday();
}

// PWA
function initPWA() {
  const manifest = {
    name: '要事',
    short_name: '要事',
    start_url: './',
    display: 'standalone',
    background_color: '#f7f5ef',
    theme_color: '#f7f5ef',
    icons: [{
      src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect fill="#f25c39" width="512" height="512" rx="100"/><text x="256" y="370" font-size="300" text-anchor="middle" fill="white" font-family="-apple-system,sans-serif" font-weight="700">要</text></svg>'),
      sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable'
    }]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
}

// Init
function init() {
  preserveYesterdayMit(); // must run BEFORE loadMit resets stale data
  renderHeader();
  renderMit();
  renderTodayTimeline();
  initPWA();

  // Check carryover (only if not already dismissed today)
  const dismissed = localStorage.getItem('yj_carryover_dismissed');
  if(dismissed !== todayStr()) checkCarryover();

  const s = loadSetts();
  if(s.whBackend) {
    fetchMonth(calYear, calMonth).then(async () => {
      // Also prefetch tomorrow's month if needed
      const tmr = new Date(Date.now() + 864e5);
      await fetchMonth(tmr.getFullYear(), tmr.getMonth());
      renderTodayAndTmr();
      renderSchedulePage();
    });
  } else {
    // Still prefetch tomorrow count from cache
    const tmr = new Date(Date.now() + 864e5);
    fetchMonth(tmr.getFullYear(), tmr.getMonth());
  }

  // Refresh time-based UI every minute
  setInterval(() => {
    if(currentPage === 'today') renderTodayTimeline();
  }, 60000);

  // Detect midnight rollover
  setInterval(() => {
    preserveYesterdayMit();
    const stored = loadMit();
    if(stored.date !== todayStr()) {
      mitData = loadMit();
      renderTodayAndTmr();
      const dismissed = localStorage.getItem('yj_carryover_dismissed');
      if(dismissed !== todayStr()) checkCarryover();
    }
  }, 30000);
}
init();
